name: Local core
on:
  push:
    branches: ['feature/local-core', 'feature/google-import', 'feature/shortcut-replacement', 'feature/windows-integration', 'feature/installable-pilot', 'feature/formats-environments', 'feature/robustness', 'feature/zagosheetswin', 'main']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore SheetsWindows.slnx --locked-mode
      - run: dotnet build SheetsWindows.slnx --configuration Release --no-restore
      - run: dotnet test SheetsWindows.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=local-core.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Publish Windows launcher
        if: runner.os == 'Windows'
        run: dotnet publish src/SheetsWindows.Windows --configuration Release --runtime win-x64 --self-contained true --output artifacts/SheetsWindows-win-x64

      - name: Verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = 'artifacts/SheetsWindows-win-x64'
          foreach ($file in @('LICENSE', 'ATTRIBUTION.md', 'SheetsWindows.exe', 'SheetsWindows.runtimeconfig.json', 'System.Windows.Forms.dll', 'coreclr.dll', 'e_sqlite3.dll', 'ExcelDataReader.dll', 'third-party/ExcelDataReader-LICENSE.txt')) {
            if (!(Test-Path (Join-Path $package $file))) { throw "Missing package dependency: $file" }
          }
          $image = [IO.File]::ReadAllBytes((Join-Path $package 'SheetsWindows.exe'))
          $peOffset = [BitConverter]::ToInt32($image, 0x3c)
          if ([BitConverter]::ToUInt16($image, $peOffset + 24 + 68) -ne 2) { throw 'Launcher must use the Windows GUI subsystem' }
          $probe = Start-Process -FilePath (Join-Path $package 'SheetsWindows.exe') -ArgumentList '--version' -PassThru
          if (!$probe.WaitForExit(30000)) { $probe.Kill(); throw 'Launcher startup timed out' }
          if ($probe.ExitCode -ne 0) { throw 'Published launcher failed to start' }

      - name: Render native branding previews offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location).Path 'artifacts/SheetsWindows-win-x64/SheetsWindows.exe'
          $output = Join-Path (Get-Location).Path 'artifacts/branding-preview'
          $process = Start-Process -FilePath $exe -ArgumentList @('--preview-branding', $output) -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Branding render timed out' }
          if ($process.ExitCode -ne 0) { throw 'Branding render failed' }
          foreach ($file in @('home.png', 'setup.png', 'recovery.png', 'about.png')) {
            if (!(Test-Path (Join-Path $output $file))) { throw "Missing preview: $file" }
          }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ZagoSheetsWin-branding-preview
          path: artifacts/branding-preview/

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ZagoSheetsWin-win-x64
          path: artifacts/SheetsWindows-win-x64/

      - name: Compile per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 compiler missing from Windows runner' }
          & $compiler installer/SheetsWindows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $oldOutput = Join-Path (Get-Location).Path "artifacts/installer-old"
          & $compiler /DPilotVersion=0.7.0 "/O$oldOutput" installer/SheetsWindows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Previous-version policy fixture compilation failed' }

      - name: Verify installation, upgrade and preservation on uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./installer/Test-UpdateVerification.ps1
          ./installer/Test-Lifecycle.ps1

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ZagoSheetsWin-Setup-win-x64
          path: artifacts/installer/ZagoSheetsWin-Setup-win-x64.exe
          if-no-files-found: error
